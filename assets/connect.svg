    <path class="social-icon" d="M 12 1.27 a 11 11 0 0 0 -3.48 21.46 c 0.55 0.1 0.75 -0.24 0.75 -0.53 v -1.87 c -3.06 0.67 -3.71 -1.48 -3.71 -1.48 c -0.5 -1.27 -1.22 -1.61 -1.22 -1.61 c -1 -0.68 0.08 -0.67 0.08 -0.67 c 1.1 0.08 1.68 1.13 1.68 1.13 c 0.98 1.68 2.57 1.2 3.2 0.92 c 0.1 -0.71 0.38 -1.2 0.69 -1.48 c -2.44 -0.28 -5.01 -1.22 -5.01 -5.44 c 0 -1.2 0.43 -2.18 1.13 -2.95 c -0.11 -0.28 -0.49 -1.4 0.11 -2.91 c 0 0 0.92 -0.29 3 1.12 c 0.88 -0.24 1.81 -0.37 2.74 -0.37 c 0.93 0 1.86 0.13 2.74 0.37 c 2.08 -1.41 3 -1.12 3 -1.12 c 0.6 1.51 0.22 2.63 0.11 2.91 c 0.7 0.77 1.13 1.75 1.13 2.95 c 0 4.23 -2.57 5.16 -5.02 5.43 c 0.39 0.34 0.74 1.01 0.74 2.03 v 3.01 c 0 0.29 0.2 0.64 0.76 0.53 A 11 11 0 0 0 12 1.27" transform="translate(80, 5) scale(0.9)"/>
  </g>
</svg>
