<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 200" width="100%" height="200">
  <defs>
    <style>
      .bg { fill: #070B16; }
      .text-white { fill: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
      .text-muted { fill: #8B95A7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #247BFF; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      
      .btn { fill: #FF354F; }
      .btn-text { fill: #F5F7FA; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      
      .social-icon { fill: #F5F7FA; }
      
      .hover-zone:hover .btn { fill: #D9253C; }
    </style>
  </defs>

  <rect width="832" height="200" class="bg" rx="16" />
  <rect x="1" y="1" width="830" height="198" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16" />
  
  <text x="40" y="45" class="text-mono">CONNECT</text>

  <text x="40" y="90" class="text-white">LET'S BUILD SOMETHING EXTRAORDINARY.</text>
  <text x="40" y="120" class="text-muted">Always open to discussing AI, Data Science, and Creative Tech.</text>
  
  <g class="hover-zone">
    <rect x="40" y="140" width="160" height="36" class="btn" rx="4" />
    <text x="120" y="162" class="btn-text" text-anchor="middle">GET IN TOUCH</text>
  </g>

  <!-- Social Icons (Visual only since SVG links don't work reliably in GH markdown if img tags are used, but they can be wrapped in markdown links) -->
  <g transform="translate(680, 140)">
    <!-- X/Twitter -->
    <path class="social-icon" d="M 18.244 2.25 h 3.308 l -7.227 8.26 l 8.502 11.24 H 16.17 l -5.214 -6.817 L 5.09 21.75 H 1.78 l 7.734 -8.835 L 1.254 2.25 H 8.08 l 4.713 6.231 zm -1.161 17.52 h 1.833 L 7.085 4.126 H 5.117 z" transform="translate(0, 5) scale(0.8)"/>
    
    <!-- LinkedIn -->
