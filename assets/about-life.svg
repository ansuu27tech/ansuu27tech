<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 280" width="100%" height="280">
  <defs>
    <style>
      .bg { fill: #070B16; }
      .text-white { fill: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-muted { fill: #8B95A7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #247BFF; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .text-heading { font-size: 20px; font-weight: 700; }
      .card { fill: #0B1020; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      
      .slide { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .anim-el { animation: none !important; }
        .slide { opacity: 0; }
        .slide-1 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="832" height="280" class="bg" rx="16" />
  <rect x="1" y="1" width="830" height="278" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16" />

  <text x="40" y="45" class="text-mono">ABOUT / LIFE</text>

  <g transform="translate(40, 70)">
    <rect width="752" height="170" class="card" rx="12" />
    
    <!-- Slides -->
    <g class="slide slide-1">
      <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.3;0.33;0.66;0.97;1" dur="12s" repeatCount="indefinite" />
      <text x="40" y="50" class="text-mono" fill="#FF354F">01 — AI &amp; TECHNOLOGY</text>
      <text x="40" y="90" class="text-white text-heading">LOGICAL PROBLEM SOLVING</text>
      <text x="40" y="120" class="text-muted" font-size="14">I leverage Artificial Intelligence and Data Science paradigms</text>
      <text x="40" y="140" class="text-muted" font-size="14">to architect intelligent, scalable frontend and backend solutions.</text>
    </g>

    <g class="slide slide-2">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.66;0.69;1" dur="12s" repeatCount="indefinite" />
      <text x="40" y="50" class="text-mono" fill="#FF354F">02 — DESIGN &amp; CREATIVITY</text>
      <text x="40" y="90" class="text-white text-heading">AESTHETICS MEET FUNCTION</text>
      <text x="40" y="120" class="text-muted" font-size="14">UI/UX is not just decoration. It is communication. I build</text>
      <text x="40" y="140" class="text-muted" font-size="14">premium digital experiences with cinematic precision and clean logic.</text>
    </g>

    <g class="slide slide-3">
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.63;0.66;0.97;1;1" dur="12s" repeatCount="indefinite" />
      <text x="40" y="50" class="text-mono" fill="#FF354F">03 — BUILDING &amp; STRATEGY</text>
      <text x="40" y="90" class="text-white text-heading">PURPOSE-DRIVEN EXECUTION</text>
      <text x="40" y="120" class="text-muted" font-size="14">As Founder of PixelMint Studio MVS, I bridge the gap between</text>
      <text x="40" y="140" class="text-muted" font-size="14">engineering and brand identity to launch ambitious digital products.</text>
    </g>

    <!-- Progress Indicator -->
    <g transform="translate(40, 150)">
      <rect x="0" y="0" width="30" height="2" fill="rgba(255,255,255,0.1)" />
      <rect x="0" y="0" width="0" height="2" fill="#247BFF">
        <animate attributeName="width" values="0;30;0;0" keyTimes="0;0.3;0.31;1" dur="12s" repeatCount="indefinite" />
      </rect>
      
      <rect x="35" y="0" width="30" height="2" fill="rgba(255,255,255,0.1)" />
      <rect x="35" y="0" width="0" height="2" fill="#247BFF">
        <animate attributeName="width" values="0;0;30;0;0" keyTimes="0;0.33;0.63;0.64;1" dur="12s" repeatCount="indefinite" />
      </rect>
      
      <rect x="70" y="0" width="30" height="2" fill="rgba(255,255,255,0.1)" />
      <rect x="70" y="0" width="0" height="2" fill="#247BFF">
        <animate attributeName="width" values="0;0;0;30;0" keyTimes="0;0.66;0.67;0.97;1" dur="12s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
