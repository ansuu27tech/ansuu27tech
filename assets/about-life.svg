<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 240" width="100%" height="240">
  <defs>
    <style>
      
      .bg { fill: #03050a; }
      .panel { fill: #0b1220; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .text-white { fill: #f5f7ff; font-family: 'Inter', sans-serif; }
      .text-muted { fill: #8d96aa; font-family: 'Inter', sans-serif; }
      .text-mono { font-family: 'JetBrains Mono', monospace; fill: #247bff; }
      .highlight { fill: #ff354f; }
    </style>
  </defs>

  <rect width="832" height="240" class="bg" rx="12" />

  <text x="40" y="40" class="text-mono" font-size="10" font-weight="700" letter-spacing="2">02 &mdash; ABOUT</text>
  
  <rect x="40" y="60" width="752" height="140" class="panel" rx="8" />
  
  <g transform="translate(70, 95)">
    <text x="0" y="0" class="text-white" font-size="22" font-weight="600">
      "Blending AI thinking with clean design to build ideas that stand out."
    </text>
    <text x="0" y="35" class="text-muted" font-size="14" font-weight="400" line-height="1.6">
      I combine logical problem-solving with creative design to engineer solutions that are
    </text>
    <text x="0" y="55" class="text-muted" font-size="14" font-weight="400" line-height="1.6">
      both functional and visually compelling. Bridging the gap between artificial intelligence,
    </text>
    <text x="0" y="75" class="text-muted" font-size="14" font-weight="400" line-height="1.6">
      data science, and premium frontend development.
    </text>
  </g>

  <!-- Decorative elements -->
  <circle cx="750" cy="130" r="40" fill="none" stroke="rgba(36, 123, 255, 0.1)" stroke-width="20" />
  <circle cx="750" cy="130" r="10" fill="none" stroke="rgba(255, 53, 79, 0.5)" stroke-width="2" />

</svg>

