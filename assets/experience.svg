<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 380" width="100%" height="380">
  <defs>
    <style>
      
      .bg { fill: #03050a; }
      .text-white { fill: #f5f7ff; font-family: 'Inter', sans-serif; }
      .text-muted { fill: #8d96aa; font-family: 'Inter', sans-serif; }
      .text-mono { font-family: 'JetBrains Mono', monospace; fill: #247bff; }
      .text-mono-crimson { font-family: 'JetBrains Mono', monospace; fill: #ff354f; }
      .line { stroke: rgba(255,255,255,0.1); stroke-width: 1; }
      .dot { fill: #247bff; }
      .dot-active { fill: #ff354f; }
    </style>
  </defs>

  <rect width="832" height="380" class="bg" rx="12" />
  <text x="40" y="40" class="text-mono" font-size="10" font-weight="700" letter-spacing="2">06 &mdash; EXPERIENCE</text>

  <g transform="translate(40, 80)">
    <!-- Timeline Line -->
    <path d="M 120 10 L 120 280" class="line" />

    <!-- 2026 - Present -->
    <g transform="translate(0, 10)">
      <text x="0" y="4" class="text-mono-crimson" font-size="12" font-weight="700">2026&mdash;PRESENT</text>
      <circle cx="120" cy="0" r="4" class="dot-active" />
      <text x="150" y="4" class="text-white" font-size="16" font-weight="600">DIGITAL MARKETING STRATEGIST</text>
      <text x="150" y="24" class="text-muted" font-size="14" font-weight="500">Draughtsman Studio</text>
      <text x="150" y="48" class="text-muted" font-size="12" font-weight="400">Leading social media growth, performance marketing, brand positioning,</text>
      <text x="150" y="64" class="text-muted" font-size="12" font-weight="400">campaign strategy, audience targeting, analytics.</text>
    </g>

    <!-- 2024 - Present -->
    <g transform="translate(0, 110)">
      <text x="0" y="4" class="text-mono" font-size="12" font-weight="700">2024&mdash;PRESENT</text>
      <circle cx="120" cy="0" r="4" class="dot" />
      <text x="150" y="4" class="text-white" font-size="16" font-weight="600">FOUNDER &amp; CREATIVE DIRECTOR</text>
      <text x="150" y="24" class="text-muted" font-size="14" font-weight="500">PixelMint Studio MVS</text>
      <text x="150" y="48" class="text-muted" font-size="12" font-weight="400">Leading creative direction, web design, development, branding, digital growth,</text>
      <text x="150" y="64" class="text-muted" font-size="12" font-weight="400">team leadership, premium digital experiences.</text>
    </g>

    <!-- 2024 -->
    <g transform="translate(0, 210)">
      <text x="68" y="4" class="text-mono" font-size="12" font-weight="700">2024</text>
      <circle cx="120" cy="0" r="4" class="dot" />
      <text x="150" y="4" class="text-white" font-size="16" font-weight="600">E-BOOK AUTHOR</text>
      <text x="150" y="24" class="text-muted" font-size="14" font-weight="500">Digital Publication</text>
    </g>

    <!-- 2023 - 2024 -->
    <g transform="translate(0, 280)">
      <text x="32" y="4" class="text-mono" font-size="12" font-weight="700">2023&mdash;2024</text>
      <circle cx="120" cy="0" r="4" class="dot" />
      <text x="150" y="4" class="text-white" font-size="16" font-weight="600">FREELANCE DEVELOPER</text>
      <text x="150" y="24" class="text-muted" font-size="14" font-weight="500">Self-Employed</text>
    </g>

  </g>
</svg>

