<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 450" width="100%" height="450">
  <defs>
    <style>
      .bg { fill: #070B16; }
      .text-white { fill: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #247BFF; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .tech-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #8B95A7; font-weight: 700; }
      
      .orbit { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .orbit-glow { fill: none; stroke: rgba(36, 123, 255, 0.3); stroke-width: 2; stroke-dasharray: 60 1200; }
      .orbit-glow-red { fill: none; stroke: rgba(255, 53, 79, 0.4); stroke-width: 2; stroke-dasharray: 40 1000; }
      
      .dot { fill: #0B1020; stroke: #247BFF; stroke-width: 1.5; }
      .dot-red { fill: #0B1020; stroke: #FF354F; stroke-width: 1.5; }
      
      @media (prefers-reduced-motion: reduce) {
        .anim-el { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="832" height="450" class="bg" rx="16" />
  <rect x="1" y="1" width="830" height="448" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16" />
  <text x="40" y="45" class="text-mono">TECH STACK</text>

  <g transform="translate(416, 240)">
    
    <!-- Core -->
    <circle cx="0" cy="0" r="24" fill="#090D18" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="0" cy="0" r="12" fill="#247BFF" opacity="0.8">
      <animate class="anim-el" attributeName="r" values="10;14;10" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="4" class="text-white" font-size="10" text-anchor="middle">CORE</text>

    <!-- Orbit 1: AI / Data (Largest) -->
    <g transform="rotate(20)">
      <ellipse cx="0" cy="0" rx="320" ry="110" class="orbit" />
      <ellipse cx="0" cy="0" rx="320" ry="110" class="orbit-glow-red">
        <animate class="anim-el" attributeName="stroke-dashoffset" from="1200" to="0" dur="15s" repeatCount="indefinite" />
      </ellipse>
      <!-- Nodes -->
      <g transform="translate(-280, -53)"><circle r="5" class="dot-red" /><text x="-15" y="-10" class="tech-mono">Python</text></g>
      <g transform="translate(-180, -90)"><circle r="5" class="dot" /><text x="-25" y="-10" class="tech-mono">Machine Learning</text></g>
      <g transform="translate(180, 90)"><circle r="5" class="dot-red" /><text x="15" y="5" class="tech-mono">Data Analysis</text></g>
      <g transform="translate(280, 53)"><circle r="5" class="dot" /><text x="15" y="5" class="tech-mono">NLP</text></g>
    </g>

    <!-- Orbit 2: Engineering (Middle) -->
    <g transform="rotate(-15)">
      <ellipse cx="0" cy="0" rx="240" ry="80" class="orbit" />
      <ellipse cx="0" cy="0" rx="240" ry="80" class="orbit-glow">
        <animate class="anim-el" attributeName="stroke-dashoffset" from="1000" to="0" dur="12s" repeatCount="indefinite" />
      </ellipse>
      <!-- Nodes -->
      <g transform="translate(-200, -44)"><circle r="5" class="dot" /><text x="-20" y="-10" class="tech-mono">React</text></g>
      <g transform="translate(-100, -72)"><circle r="5" class="dot-red" /><text x="-25" y="-10" class="tech-mono">Next.js</text></g>
      <g transform="translate(0, -80)"><circle r="5" class="dot" /><text x="-35" y="-10" class="tech-mono">TypeScript</text></g>
      <g transform="translate(100, -72)"><circle r="5" class="dot" /><text x="15" y="-10" class="tech-mono">HTML/CSS</text></g>
      <g transform="translate(180, -53)"><circle r="5" class="dot-red" /><text x="15" y="-5" class="tech-mono">Framer Motion</text></g>
      <g transform="translate(200, 44)"><circle r="5" class="dot" /><text x="15" y="5" class="tech-mono">Three.js</text></g>
    </g>

    <!-- Orbit 3: Creative / Strategy (Smallest) -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="160" ry="50" class="orbit" />
      <ellipse cx="0" cy="0" rx="160" ry="50" class="orbit-glow">
        <animate class="anim-el" attributeName="stroke-dashoffset" from="800" to="0" dur="10s" repeatCount="indefinite" />
      </ellipse>
      <!-- Nodes -->
      <g transform="translate(-140, -24)"><circle r="5" class="dot-red" /><text x="-20" y="-10" class="tech-mono" transform="rotate(-35)">UI/UX</text></g>
      <g transform="translate(-80, -43)"><circle r="5" class="dot" /><text x="-30" y="-10" class="tech-mono" transform="rotate(-35)">Figma</text></g>
      <g transform="translate(80, 43)"><circle r="5" class="dot" /><text x="15" y="5" class="tech-mono" transform="rotate(-35)">Branding</text></g>
      <g transform="translate(130, 29)"><circle r="5" class="dot-red" /><text x="15" y="5" class="tech-mono" transform="rotate(-35)">Digital Marketing</text></g>
    </g>

  </g>
</svg>
