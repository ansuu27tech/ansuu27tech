<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 300" width="100%" height="300">
  <defs>
    <style>
      .bg { fill: #070B16; }
      .text-white { fill: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
      .text-muted { fill: #8B95A7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #247BFF; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .text-mono-red { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #FF354F; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .card { fill: #090D18; stroke: rgba(36, 123, 255, 0.2); stroke-width: 1; }
      
      .tag { fill: #0B1020; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .tag-text { fill: #8B95A7; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 10px; }
      
      .pm-logo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #F5F7FA; letter-spacing: -1px; }
      .pm-accent { fill: #247BFF; }
      
      @media (prefers-reduced-motion: reduce) {
        .anim-el { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="832" height="300" class="bg" rx="16" />
  <rect x="1" y="1" width="830" height="298" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16" />
  
  <text x="40" y="45" class="text-mono">FOUNDER / STUDIO</text>

  <g transform="translate(40, 70)">
    <rect width="752" height="190" class="card" rx="12" />
    
    <text x="40" y="50" class="pm-logo">PIXEL<tspan class="pm-accent">MINT</tspan></text>
    <text x="40" y="70" class="text-mono-red">STUDIO MVS</text>

    <text x="40" y="110" class="text-white" font-size="16">CRAFTING THE FUTURE OF DIGITAL.</text>
    
    <text x="40" y="140" class="text-muted">A specialized design and engineering collective combining</text>
    <text x="40" y="160" class="text-muted">experimental aesthetics with rigorous logic.</text>
    
    <!-- Service Tags -->
    <g transform="translate(420, 30)">
      <rect x="0" y="0" width="140" height="26" class="tag" rx="4" />
      <text x="10" y="17" class="tag-text">Website Design</text>
      
      <rect x="150" y="0" width="140" height="26" class="tag" rx="4" />
      <text x="160" y="17" class="tag-text">Web Development</text>
      
      <rect x="0" y="34" width="140" height="26" class="tag" rx="4" />
      <text x="10" y="51" class="tag-text">E-Commerce</text>
      
      <rect x="150" y="34" width="140" height="26" class="tag" rx="4" />
      <text x="160" y="51" class="tag-text">UI/UX Design</text>
      
      <rect x="0" y="68" width="140" height="26" class="tag" rx="4" />
      <text x="10" y="85" class="tag-text">Branding</text>
      
      <rect x="150" y="68" width="140" height="26" class="tag" rx="4" />
      <text x="160" y="85" class="tag-text">Landing Pages</text>

      <rect x="0" y="102" width="140" height="26" class="tag" rx="4" />
      <text x="10" y="119" class="tag-text">Digital Marketing</text>
      
      <rect x="150" y="102" width="140" height="26" class="tag" rx="4" />
      <text x="160" y="119" class="tag-text">Social Media</text>
    </g>

  </g>
</svg>
