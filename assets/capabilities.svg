<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 280" width="100%" height="280">
  <defs>
    <style>
      .bg { fill: #070B16; }
      .text-white { fill: #F5F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; }
      .text-muted { fill: #8B95A7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; fill: #247BFF; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .card { fill: #0B1020; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    </style>
  </defs>

  <rect width="832" height="280" class="bg" rx="16" />
  <rect x="1" y="1" width="830" height="278" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16" />
  <text x="40" y="45" class="text-mono">CAPABILITIES</text>

  <!-- Capability Cards -->
  <g transform="translate(40, 70)">
    
    <!-- AI & Data Science -->
    <g transform="translate(0, 0)">
      <rect width="175" height="170" class="card" rx="8" />
      <text x="20" y="30" class="text-white">AI &amp; DATA</text>
      <text x="20" y="55" class="text-muted">Python</text>
      <text x="20" y="75" class="text-muted">Machine Learning</text>
      <text x="20" y="95" class="text-muted">Data Analysis</text>
      <text x="20" y="115" class="text-muted">AI Automation</text>
      <text x="20" y="135" class="text-muted">NLP</text>
    </g>

    <!-- Engineering -->
    <g transform="translate(193, 0)">
      <rect width="175" height="170" class="card" rx="8" />
      <text x="20" y="30" class="text-white">ENGINEERING</text>
      <text x="20" y="55" class="text-muted">React &amp; Next.js</text>
      <text x="20" y="75" class="text-muted">TypeScript</text>
      <text x="20" y="95" class="text-muted">HTML / CSS</text>
      <text x="20" y="115" class="text-muted">Framer Motion</text>
      <text x="20" y="135" class="text-muted">Three.js</text>
    </g>

    <!-- Creative -->
    <g transform="translate(386, 0)">
      <rect width="175" height="170" class="card" rx="8" />
      <text x="20" y="30" class="text-white">CREATIVE</text>
      <text x="20" y="55" class="text-muted">UI/UX Design</text>
      <text x="20" y="75" class="text-muted">Branding</text>
      <text x="20" y="95" class="text-muted">Graphic Design</text>
      <text x="20" y="115" class="text-muted">Motion Design</text>
      <text x="20" y="135" class="text-muted">Figma</text>
    </g>

    <!-- Strategy -->
    <g transform="translate(579, 0)">
      <rect width="175" height="170" class="card" rx="8" />
      <text x="20" y="30" class="text-white">STRATEGY</text>
      <text x="20" y="55" class="text-muted">Digital Marketing</text>
      <text x="20" y="75" class="text-muted">Social Media</text>
      <text x="20" y="95" class="text-muted">Content Strategy</text>
      <text x="20" y="115" class="text-muted">Analytics</text>
      <text x="20" y="135" class="text-muted">Growth</text>
    </g>

  </g>
</svg>
